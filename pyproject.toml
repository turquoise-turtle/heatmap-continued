[project]
name = "review-heatmap"
version = "2.0.1"
description = "Review Heatmap Anki add-on (modernised fork) - development environment"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []

[dependency-groups]
# Default test environment. tests/run_matrix.sh runs the suite against every
# supported Anki release in throw-away environments.
dev = [
    "anki==26.9.3",
    "aqt[qt]==26.9.3",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: starts a headless Anki instance (slow)"]
addopts = "-ra"

[tool.uv]
package = false
